apiVersion: apps/v1
kind: Deployment
metadata: {name: upf, labels: {app: upf}}
spec:
  replicas: 1
  selector: {matchLabels: {app: upf}}
  template:
    metadata: {labels: {app: upf}}
    spec:
      containers:
        - name: upf
          image: litecore-upf:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: grpc, containerPort: 50053}]
          readinessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: upf}
spec:
  selector: {app: upf}
  ports: [{name: grpc, port: 50053, targetPort: grpc}]
