syntax = "proto3";

package upf;

option go_package = "github.com/5g-core/proto/upf";

// SMF 向 UPF 下发转发规则
message CreateRuleRequest {
  string session_id = 1;  // 会话ID
  string ue_id      = 2;  // 设备ID
  string ue_ip      = 3;  // UE的IP地址
  string dnn        = 4;  // 数据网络名称
}

message CreateRuleResponse {
  bool   success = 1;
  string rule_id = 2;  // 转发规则ID
  string message = 3;
}

// 删除转发规则
message DeleteRuleRequest {
  string rule_id    = 1;
  string session_id = 2;
}

message DeleteRuleResponse {
  bool   success = 1;
  string message = 2;
}

// 查询转发规则（用于调试和监控）
message GetStatsRequest {
  string rule_id = 1;
}

message GetStatsResponse {
  string rule_id        = 1;
  string ue_ip          = 2;
  uint64 packets_forwarded = 3;  // 已转发包数量
  bool   active         = 4;
}

service UPFService {
  rpc CreateRule (CreateRuleRequest) returns (CreateRuleResponse);
  rpc DeleteRule (DeleteRuleRequest) returns (DeleteRuleResponse);
  rpc GetStats   (GetStatsRequest)   returns (GetStatsResponse);
}